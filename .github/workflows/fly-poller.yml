name: Deploy Hisense poller to Fly.io

# Auto-deploys the poller whenever you push changes to hisense-poller/ on main.
# The app lives in a subfolder so we pass --config and change the working dir.

on:
  push:
    branches:
      - main
    paths:
      - 'hisense-poller/**'
      - '.github/workflows/fly-poller.yml'
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  deploy:
    name: Deploy poller
    runs-on: ubuntu-latest
    concurrency:
      group: fly-poller-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        working-directory: ./hisense-poller
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
